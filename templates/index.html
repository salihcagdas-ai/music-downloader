<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎵 Music Downloader</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card2: #232733;
      --text: #e8eaed;
      --muted: #9aa0aa;
      --accent: #ff4d6d;
      --accent2: #6d8bff;
      --ok: #3ddc84;
      --err: #ff5a5a;
      --border: #2c313d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      padding: 32px 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .btn-danger {
      background: var(--card2); color: var(--err); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .btn-danger:hover { background: rgba(255,90,90,.12); border-color: var(--err); }
    /* Kapatma sonrası tam ekran mesaj */
    .closed-screen {
      position: fixed; inset: 0; background: var(--bg); display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; gap: 8px;
    }
    .closed-screen .big { font-size: 52px; }
    .closed-screen h2 { font-size: 22px; margin: 8px 0 0; }
    .closed-screen p { color: var(--muted); font-size: 15px; max-width: 420px; margin: 4px 0 0; line-height: 1.6; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; margin-bottom: 20px;
    }
    textarea {
      width: 100%; min-height: 120px; resize: vertical;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; font-size: 14px; font-family: ui-monospace, monospace;
      line-height: 1.5;
    }
    textarea:focus { outline: none; border-color: var(--accent2); }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
    .seg { display: inline-flex; background: var(--card2); border-radius: 10px; padding: 4px; gap: 4px; }
    .seg button {
      border: none; background: transparent; color: var(--muted);
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px;
      font-weight: 600; transition: all .15s;
    }
    .seg button.active { background: var(--accent); color: #fff; }
    select {
      background: var(--card2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
    }
    .spacer { flex: 1; }
    .btn {
      border: none; border-radius: 10px; padding: 11px 22px; font-size: 15px;
      font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--card2); color: var(--text); }
    .btn:hover:not(:disabled) { opacity: .85; }
    .jobs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .jobs-head h2 { font-size: 16px; margin: 0; }
    .job {
      background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px;
    }
    .job-top { display: flex; align-items: center; gap: 10px; }
    .job-title {
      flex: 1; font-size: 14px; font-weight: 600; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .badge {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .3px; white-space: nowrap;
    }
    .badge.queued { background: #33384410; color: var(--muted); border:1px solid var(--border); }
    .badge.downloading { background: rgba(109,139,255,.15); color: var(--accent2); }
    .badge.processing { background: rgba(255,193,77,.15); color: #ffc14d; }
    .badge.done { background: rgba(61,220,132,.15); color: var(--ok); }
    .badge.error { background: rgba(255,90,90,.15); color: var(--err); }
    .bar { height: 6px; background: var(--bg); border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0; transition: width .3s; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; }
    .err-msg { font-size: 12px; color: var(--err); margin-top: 6px; word-break: break-word; }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
    a.link { color: var(--accent2); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>🎵 Music Downloader</h1>
        <p class="sub">Linkleri yapıştır (her satıra bir tane) — YouTube &amp; Facebook. Dosyalar <code>downloads/</code> klasörüne iner.</p>
      </div>
      <button class="btn-danger" id="shutdown" title="Sunucuyu kapat">⏻ Kapat</button>
    </div>

    <div class="card">
      <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.facebook.com/...&#10;https://youtu.be/..."></textarea>
      <div class="row">
        <div class="seg" id="fmt">
          <button data-fmt="audio" class="active">🎧 Ses (mp3)</button>
          <button data-fmt="video">🎬 Video (mp4)</button>
        </div>
        <select id="quality">
          <option value="320">320 kbps</option>
          <option value="192" selected>192 kbps</option>
          <option value="128">128 kbps</option>
        </select>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="go">İndir</button>
      </div>
    </div>

    <div class="jobs-head">
      <h2>İndirmeler</h2>
      <div class="row" style="margin:0; gap:8px;">
        <button class="btn btn-ghost" id="openFolder" style="padding:7px 14px; font-size:13px;">📂 Klasörü aç</button>
        <button class="btn btn-ghost" id="clear" style="padding:7px 14px; font-size:13px;">Temizle</button>
      </div>
    </div>
    <div id="jobs"><div class="empty">Henüz indirme yok.</div></div>
  </div>

  <script>
    let fmt = "audio";
    const $ = (s) => document.querySelector(s);

    // Format seçici (Ses / Video)
    $("#fmt").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      fmt = b.dataset.fmt;
      [...$("#fmt").children].forEach(x => x.classList.toggle("active", x === b));
      $("#quality").style.display = (fmt === "audio") ? "" : "none";
    });

    async function startDownload() {
      if ($("#go").disabled) return;   // zaten bir gönderim devam ediyor
      const urls = $("#urls").value;
      const quality = $("#quality").value;
      if (!urls.trim()) { $("#urls").focus(); return; }
      $("#go").disabled = true;
      $("#go").textContent = "Ekleniyor…";
      try {
        const r = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ urls, format: fmt, quality })
        });
        const d = await r.json();
        if (d.error) { alert(d.error); }
        else { $("#urls").value = ""; }
      } catch (e) { alert("Hata: " + e.message); }
      $("#go").disabled = false;
      $("#go").textContent = "İndir";
      refresh();
    }

    $("#go").addEventListener("click", startDownload);
    // Cmd/Ctrl + Enter ile de indir
    $("#urls").addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        startDownload();
      }
    });

    $("#clear").addEventListener("click", async () => {
      await fetch("/api/clear", { method: "POST" });
      refresh();
    });
    $("#openFolder").addEventListener("click", () => {
      fetch("/api/open-folder", { method: "POST" });
    });

    // ⏻ Kapat — sunucuyu durdur (teknik olmayan kullanıcı için terminalsiz kapanış)
    $("#shutdown").addEventListener("click", async () => {
      if (!confirm("Sunucuyu kapatmak istediğinize emin misiniz?\n\nİndirme sürüyorsa yarıda kalır.")) return;
      clearInterval(pollTimer);                 // yoklamayı durdur (hata mesajı çıkmasın)
      try { await fetch("/api/shutdown", { method: "POST" }); } catch (e) { /* zaten kapanıyor */ }
      document.body.innerHTML =
        `<div class="closed-screen">
           <div class="big">✅</div>
           <h2>Sunucu kapatıldı</h2>
           <p>Bu sekmeyi artık kapatabilirsiniz.<br>
              Tekrar indirmek için <b>Müzik İndirici</b>'ye çift tıklayın.</p>
         </div>`;
    });

    const STATUS_TR = {
      queued: "sırada", downloading: "iniyor",
      processing: "işleniyor", done: "bitti", error: "hata"
    };

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function renderJob(j) {
      const meta = [];
      if (j.status === "downloading") {
        if (j.speed) meta.push(esc(j.speed));
        if (j.eta) meta.push("kalan " + esc(j.eta));
      }
      meta.push(j.format === "audio" ? "🎧 mp3" : "🎬 mp4");
      return `
        <div class="job">
          <div class="job-top">
            <div class="job-title" title="${esc(j.title)}">${esc(j.title)}</div>
            <span class="badge ${j.status}">${STATUS_TR[j.status] || j.status}</span>
          </div>
          ${(j.status === "downloading" || j.status === "processing")
            ? `<div class="bar"><div style="width:${j.percent}%"></div></div>` : ""}
          <div class="meta">${meta.join(" · ")}</div>
          ${j.error ? `<div class="err-msg">⚠️ ${esc(j.error)}</div>` : ""}
        </div>`;
    }

    async function refresh() {
      try {
        const r = await fetch("/api/jobs");
        const jobs = await r.json();
        const el = $("#jobs");
        if (!jobs.length) { el.innerHTML = `<div class="empty">Henüz indirme yok.</div>`; return; }
        el.innerHTML = jobs.map(renderJob).join("");
      } catch (e) { /* sessiz geç */ }
    }

    const pollTimer = setInterval(refresh, 1000);
    refresh();
  </script>
</body>
</html>
