name: Build Windows application

# A maintainer starts this explicitly. No binaries or releases are auto-published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Set up Node.js for browser logic tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check source and run offline tests
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest
          python -m pip check
          node --check static/app.js
          node --test tests-ui/app.test.mjs
      - name: Build application and dependency notices
        run: python scripts/build_windows.py
      - name: Upload portable application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MusicDownloader-Windows
          path: |
            dist/MusicDownloader.exe
            dist/THIRD_PARTY_NOTICES/**
            dist/THIRD_PARTY.md
          if-no-files-found: error
          retention-days: 7
